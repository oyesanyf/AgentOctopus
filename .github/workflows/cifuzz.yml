name: CIFuzz Continuous Runtime Fuzzing
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # Continuous execution every 6 hours

permissions:
  contents: read

jobs:
  ContinuousFuzzing:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Codebase
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Verify Rust Toolchain
      run: |
        rustup default stable
        rustc --version
        cargo --version

    - name: Run CIFuzz Continuous Runtime Engine & Containment Verification
      run: |
        mkdir -p ./build/out/artifacts
        cargo test --test research_and_atlas_tests test_continuous_oss_fuzz_arm -- --nocapture
        cargo test --test oshoosiclaw_adapted_containment_tests -- --nocapture

    - name: Upload CIFuzz Crash Artifacts
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      if: failure()
      with:
        name: cifuzz-crashes
        path: ./build/out/artifacts
