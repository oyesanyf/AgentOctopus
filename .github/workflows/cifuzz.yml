name: CIFuzz Continuous Runtime Fuzzing
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # Continuous execution every 6 hours

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ContinuousFuzzing:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v6

    - name: Verify Rust Toolchain
      run: |
        rustup default stable
        rustc --version
        cargo --version

    - name: Run CIFuzz Continuous Runtime Engine & Containment Verification
      run: |
        mkdir -p ./build/out/artifacts
        cargo test --test research_and_atlas_tests test_continuous_oss_fuzz_arm -- --nocapture
        cargo test --test oshoosiclaw_adapted_containment_tests -- --nocapture
        cargo test --test cage_governance_integration_tests -- --nocapture

    - name: Upload CIFuzz Crash Artifacts
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: cifuzz-crashes
        path: ./build/out/artifacts
