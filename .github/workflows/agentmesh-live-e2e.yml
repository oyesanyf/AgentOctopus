name: AgentMesh v0.2.0 Cross-Platform Live E2E

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  agentmesh-live-matrix:
    name: AgentMesh v0.2.0 Live E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache Cargo Registry and Build Artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          key: agentmesh-live-e2e-${{ matrix.os }}

      - name: Run Unit & Linux Seccomp-BPF Confinement Tests
        shell: bash
        run: |
          cargo test --lib security::agentmesh
          cargo test --lib security::linux_sandbox

      - name: Run Embedded Sandbox & Adversarial Integration Tests
        shell: bash
        run: |
          cargo test --test agentmesh_integration_tests
          cargo test --test agentmesh_m1_adversarial_stress_tests

      - name: Run Live Multi-Node E2E against Official google/agentmesh v0.2.0 (run.sh)
        shell: bash
        run: |
          chmod +x ./examples/agentmesh-wasm-sandbox/run.sh
          ./examples/agentmesh-wasm-sandbox/run.sh

      - name: Verify PowerShell Launcher on Windows (run.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./examples/agentmesh-wasm-sandbox/run.ps1
