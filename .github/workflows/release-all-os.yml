name: AgentOctopus Cross-Platform Release Builds & Windows MSI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0)'
        required: false
        default: '0.2.0'
      publish_release:
        description: 'Publish GitHub Release (true/false)'
        required: false
        default: 'false'

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Windows x86_64 Native MSVC + WiX v5 MSI & Portable ZIP ───────────────
  build-windows-x64:
    name: Windows x64 (.msi & .zip)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          key: agentoctopus-release-windows-x64
          cache-on-failure: true

      - name: Install WiX v5 CLI
        shell: pwsh
        run: |
          try { dotnet tool install --global wix --version 5.0.2 } catch {}
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix --version

      - name: Build Windows Release Binaries, WiX MSI & Verify
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $ver = if ($env:REF_NAME -like "v*") { $env:REF_NAME.Substring(1) } elseif ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { "0.2.0" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package_windows_msi.ps1 -Version $ver
          & "target\release\start.exe" --verify
          if ($LASTEXITCODE -ne 0) { throw "start.exe --verify smoke check failed" }
          & "target\release\octopus.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "octopus.exe --version failed" }

      - name: Upload Windows x64 Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentoctopus-windows-x64
          path: |
            deploy/windows/*.msi
            deploy/windows/*.zip
            deploy/windows/SHA256SUMS-*.txt
          if-no-files-found: error

  # ── 2. Linux x86_64 Native Build (.deb, .rpm, .tar.gz) ──────────────────────
  build-linux-x64:
    name: Linux x64 (.deb, .rpm, .tar.gz)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux Build & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev dpkg-dev rpm

      - name: Install Rust stable (x86_64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          key: agentoctopus-release-linux-x64
          cache-on-failure: true

      - name: Build, Smoke-Test & Package Linux x64
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-0.2.0}"
          if [[ "${REF_NAME}" == v* ]]; then VERSION="${REF_NAME#v}"; fi
          cargo build --release --bins --target x86_64-unknown-linux-gnu
          ./target/x86_64-unknown-linux-gnu/release/start --verify
          ./target/x86_64-unknown-linux-gnu/release/octopus --version
          chmod +x packaging/linux/build_packages.sh
          ./packaging/linux/build_packages.sh target/x86_64-unknown-linux-gnu/release "${VERSION}" amd64 deploy/linux-x64

      - name: Upload Linux x64 Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentoctopus-linux-x64
          path: |
            deploy/linux-x64/*.deb
            deploy/linux-x64/*.rpm
            deploy/linux-x64/*.tar.gz
            deploy/linux-x64/SHA256SUMS-*.txt
          if-no-files-found: error

  # ── 3. Linux aarch64 Cross-Build (.deb, .rpm, .tar.gz) ──────────────────────
  build-linux-arm64:
    name: Linux arm64 (.deb, .rpm, .tar.gz)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install aarch64 Cross-Compiler & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config libssl-dev dpkg-dev rpm

      - name: Install Rust stable (aarch64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          key: agentoctopus-release-linux-arm64
          cache-on-failure: true

      - name: Cross-Build & Package Linux arm64
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          VERSION="${INPUT_VERSION:-0.2.0}"
          if [[ "${REF_NAME}" == v* ]]; then VERSION="${REF_NAME#v}"; fi
          cargo build --release --bins --target aarch64-unknown-linux-gnu
          chmod +x packaging/linux/build_packages.sh
          ./packaging/linux/build_packages.sh target/aarch64-unknown-linux-gnu/release "${VERSION}" arm64 deploy/linux-arm64

      - name: Upload Linux arm64 Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentoctopus-linux-arm64
          path: |
            deploy/linux-arm64/*.deb
            deploy/linux-arm64/*.rpm
            deploy/linux-arm64/*.tar.gz
            deploy/linux-arm64/SHA256SUMS-*.txt
          if-no-files-found: error

  # ── 4. macOS Universal (Apple Silicon + Intel) (.pkg & .tar.gz) ─────────────
  build-macos-universal:
    name: macOS Universal (.pkg & .tar.gz)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable (aarch64 + x86_64 Darwin)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          key: agentoctopus-release-macos-universal
          cache-on-failure: true

      - name: Build Universal macOS Binaries, Smoke-Test & Package
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-0.2.0}"
          if [[ "${REF_NAME}" == v* ]]; then VERSION="${REF_NAME#v}"; fi
          cargo build --release --bins --target aarch64-apple-darwin
          cargo build --release --bins --target x86_64-apple-darwin
          mkdir -p target/universal-release
          for b in agent_octopus octopus start octopus-sentinel octopus-supervisor octopus-worker; do
            lipo -create \
              "target/aarch64-apple-darwin/release/${b}" \
              "target/x86_64-apple-darwin/release/${b}" \
              -output "target/universal-release/${b}"
            chmod 755 "target/universal-release/${b}"
          done
          ./target/universal-release/start --verify
          ./target/universal-release/octopus --version
          chmod +x packaging/macos/build_packages.sh
          ./packaging/macos/build_packages.sh target/universal-release "${VERSION}" universal deploy/macos

      - name: Upload macOS Universal Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentoctopus-macos-universal
          path: |
            deploy/macos/*.pkg
            deploy/macos/*.tar.gz
            deploy/macos/SHA256SUMS-*.txt
          if-no-files-found: error

  # ── 5. Aggregate Unified Checksums & Optional GitHub Release Publish ────────
  publish-release:
    name: Unified SHA256SUMS & Release Bundle
    runs-on: ubuntu-latest
    needs: [build-windows-x64, build-linux-x64, build-linux-arm64, build-macos-universal]
    permissions:
      contents: write
    steps:
      - name: Download All Platform Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release_dist
          merge-multiple: true

      - name: Generate Unified SHA256SUMS.txt
        run: |
          cd release_dist
          rm -f SHA256SUMS-*.txt SHA256SUMS.txt
          sha256sum ./* > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload Unified All-OS Release Bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentoctopus-all-os-release-bundle
          path: release_dist/
          if-no-files-found: error

      - name: Publish GitHub Release (on v* tag or explicit publish_release=true)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${REF_NAME}"
          if [[ "${TAG}" != v* ]]; then
            TAG="v${INPUT_VERSION:-0.2.0}"
          fi
          NOTES_FILE="$(mktemp)"
          cat > "${NOTES_FILE}" << EOF
          # AgentOctopus ${TAG} — Cross-Platform Release

          Includes native installers and portable bundles for Windows (WiX MSI + ZIP), Linux x86_64 & arm64 (.deb, .rpm, .tar.gz), and macOS Universal (.pkg, .tar.gz), with unified SHA256SUMS.txt verification.
          EOF
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release_dist/* --repo "${REPO}" --clobber
          else
            gh release create "${TAG}" release_dist/* --repo "${REPO}" --title "AgentOctopus ${TAG}" --notes-file "${NOTES_FILE}"
          fi
          rm -f "${NOTES_FILE}"
