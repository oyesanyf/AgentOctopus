name: Witness SDLC Attestation & OPA Rego Gate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  witness-supply-chain:
    name: Witness Cryptographic SDLC & OPA Rego Gate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install Python Cryptography
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.7.5
        with:
          key: witness-sdlc

      - name: Attempt Witness CLI Download (Optional Native Acceleration)
        shell: pwsh
        run: |
          try {
            $witnessVer = "0.5.2"
            $url = "https://github.com/in-toto/witness/releases/download/v$witnessVer/witness_${witnessVer}_windows_amd64.tar.gz"
            Invoke-WebRequest -Uri $url -OutFile witness.tar.gz -TimeoutSec 10 -ErrorAction SilentlyContinue
            if (Test-Path witness.tar.gz) {
              tar -xzf witness.tar.gz
              if (Test-Path witness.exe) {
                if ($env:GITHUB_PATH) {
                  Add-Content -Path $env:GITHUB_PATH -Value $PWD.Path
                }
                Write-Host "Official Witness CLI installed successfully in workspace."
              }
            }
          } catch {
            Write-Host "Native witness binary download skipped; using built-in deterministic Python witness engine."
          }

      - name: Run Witness CI Pipeline Self-Test Suite
        run: |
          python scripts/witness_ci_pipeline.py --selftest

      - name: Generate Ephemeral CI Keypair & Sign Policy
        run: |
          python scripts/witness_ci_pipeline.py keygen --out-dir .witness --policy-template policy/witness/witness-policy-template.json

      - name: Stage 1 - Attested Unit Tests
        run: |
          python scripts/witness_ci_pipeline.py run `
            --step unit-tests `
            --outfile .witness/unit-tests.att.json `
            --key .witness/witness-ci-private.pem `
            --materials "Cargo.lock,Cargo.toml" `
            -- cargo test -p agent_octopus --test cage_governance_integration_tests

      - name: Stage 2 - Attested Security Scan
        run: |
          python scripts/witness_ci_pipeline.py run `
            --step security-scan `
            --outfile .witness/security-scan.att.json `
            --key .witness/witness-ci-private.pem `
            --materials "Cargo.lock,Cargo.toml" `
            -- cargo check -p agent_octopus --bins

      - name: Stage 3 - Attested Release Build
        shell: pwsh
        run: |
          python scripts/witness_ci_pipeline.py run `
            --step release-build `
            --outfile .witness/release-build.att.json `
            --key .witness/witness-ci-private.pem `
            --materials "Cargo.lock,Cargo.toml" `
            --products "target/release/agent_octopus.exe" `
            -- cargo build --release -p agent_octopus --bin agent_octopus

      - name: Stage 4 - Attested Release Bundle & Packaging
        shell: pwsh
        run: |
          python scripts/witness_ci_pipeline.py run `
            --step msi-sign `
            --outfile .witness/msi-sign.att.json `
            --key .witness/witness-ci-private.pem `
            --materials "target/release/agent_octopus.exe,Cargo.lock" `
            --products "AgentOctopus-release.zip" `
            -- pwsh -Command "Compress-Archive -Path target/release/agent_octopus.exe,README.md,Cargo.toml -DestinationPath AgentOctopus-release.zip -Force"

      - name: Mandatory Cryptographic Verification Gate & Bundle Assembly
        run: |
          python scripts/witness_ci_pipeline.py verify `
            --policy .witness/witness-policy.signed.json `
            --public-key .witness/witness-ci-public.pem `
            --attestations .witness/unit-tests.att.json .witness/security-scan.att.json .witness/release-build.att.json .witness/msi-sign.att.json `
            --subject AgentOctopus-release.zip `
            --bundle-out witness-sdlc-bundle.intoto.jsonl

      - name: Upload Witness Attestation Bundle Artifact
        uses: actions/upload-artifact@v7
        with:
          name: witness-attestations
          path: |
            .witness/*
            witness-sdlc-bundle.intoto.jsonl
          if-no-files-found: error
